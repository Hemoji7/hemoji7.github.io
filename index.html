<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hemoji Rao G</title>
  <style>
    :root { --bg:#0e1420; --panel:#162033; --text:#e8edf7; --muted:#9aa7bf; --accent:#6ea8ff; --border:#27365a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 72px 20px; }
    h1 { font-size: 2.2rem; }
    .headline { color: var(--muted); margin-top: 6px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; margin-top: 28px; }
    .card h2 { font-size: 1rem; color: var(--accent); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
    .links { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
    .links a { color: var(--text); border: 1px solid var(--border); background: var(--panel); padding: 10px 16px; border-radius: 10px; text-decoration: none; font-weight: 600; }
    .links a:hover { border-color: var(--accent); }
    footer { color: var(--muted); font-size: .85rem; margin-top: 40px; }
    .thinking { color: var(--muted); font-style: italic; margin-top: 10px; }
    .thinking::after { content: ""; animation: dots 1.4s steps(4, end) infinite; }
    @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Hemoji Rao G</h1>
    <p class="headline">Add your headline here</p>

    <section class="card">
      <h2>Work in progress</h2>
      <p>Work in progress…</p>
      <p class="thinking">Thinking...</p>
      <video autoplay muted loop playsinline controls preload="auto" style="width:100%; border-radius:10px; margin-top:14px; background:#000;">
        <source src="media/work-in-progress.mp4" type="video/mp4">
        Your browser can't play this video.
      </video>
    </section>

    <section class="card">
      <h2>About</h2>
      <p>A short summary of who you are and what you work on. Replace this text with your own.</p>
      <p class="thinking">Thinking...</p>
    </section>

    <section class="card">
      <h2>Projects</h2>
      <p>Browse my open-source work on <a href="https://github.com/hemoji7" style="color:var(--accent)">GitHub</a>.</p>
      <p class="thinking">Thinking...</p>
    </section>

    <nav class="links">
      <a href="https://github.com/hemoji7" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.linkedin.com/in/hemoji-rao-g-6159458" target="_blank" rel="noopener">LinkedIn</a>
    </nav>

    <footer>© Hemoji Rao G</footer>
  </main>
</body>
</html>
